version: '3'

# Windows 和 Android 共用的构建步骤。
tasks:
  go:mod:tidy:
    summary: 整理 Go 模块依赖
    internal: true
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: 使用 pnpm 安装前端依赖
    internal: true
    run: once
    dir: frontend
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/**/*
    preconditions:
      - sh: pnpm --version
        msg: "未找到 pnpm"
    cmds:
      - pnpm install

  generate:bindings:
    summary: 为前端生成 TypeScript 绑定
    internal: true
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true{{if eq .OBFUSCATED "true"}} -obfuscated{{end}} -ts -i

  build:frontend:
    summary: 使用 pnpm 构建前端
    internal: true
    run: once
    dir: frontend
    sources:
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - vite.config.ts
      - index.html
      - public/**/*
      - src/**/*
      - bindings/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
    cmds:
      - pnpm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}}
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  dev:frontend:
    summary: 启动前端开发服务器
    deps:
      - task: install:frontend:deps
    dir: frontend
    cmds:
      - pnpm dev --port {{.VITE_PORT}} --strictPort
