version: '3'

includes:
  common: ../Taskfile.yml

vars:
  APP_ID: '{{.APP_ID | default "com.wails.app"}}'
  MIN_SDK: '21'
  TARGET_SDK: '35'
  # Android builds target physical arm64 devices by default. Override with
  # `ARCH=x86_64` only when another architecture is explicitly needed.
  DEFAULT_ARCH: arm64
  HOST_ARCH: '{{ARCH}}'
  # System-image ABI for the host, used in the "create an AVD" hint below.
  ANDROID_ABI: '{{if eq .HOST_ARCH "arm64"}}arm64-v8a{{else}}x86_64{{end}}'
  # Android builds are run from Windows in this project.
  SDK_ROOT: '{{if .ANDROID_HOME}}{{.ANDROID_HOME}}{{else if .ANDROID_SDK_ROOT}}{{.ANDROID_SDK_ROOT}}{{else}}{{.HOME}}/AppData/Local/Android/Sdk{{end}}'
  ADB: '{{.SDK_ROOT}}/platform-tools/adb.exe'
  EMULATOR: '{{.SDK_ROOT}}/emulator/emulator.exe'
  AVDMANAGER: '{{.SDK_ROOT}}/cmdline-tools/latest/bin/avdmanager.bat'

tasks:
  install:deps:
    summary: Check and install Android development dependencies
    cmds:
      - go run build/android/scripts/deps/install_deps.go
    env:
      TASK_FORCE_YES: '{{if .YES}}true{{else}}false{{end}}'
    prompt: This will check and install Android development dependencies. Continue?

  prepare:
    internal: true
    summary: Builds the frontend and Android Go shared library
    deps:
      - task: common:go:mod:tidy
      - task: generate:android:overlay
      - task: common:build:frontend
        vars:
          # TypeScript bindings are platform-neutral. Generating them with
          # Android build tags from a Windows host makes Wails beta.8's package
          # loader scan both GOOS implementations and emit spurious conflicts.
          # Keep binding generation on the host platform; Android tags are only
          # needed for the native shared-library build below.
          BUILD_FLAGS: ''
          PRODUCTION:
            ref: .PRODUCTION
    cmds:
      - echo "Building Android app {{.APP_NAME}}..."
      - task: compile:go:shared
        vars:
          ARCH: '{{.ARCH | default .DEFAULT_ARCH}}'
          PRODUCTION:
            ref: .PRODUCTION
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production,android -trimpath -buildvcs=false -ldflags="-w -s"{{else}}-tags android,debug -buildvcs=false -gcflags=all="-l"{{end}}'
    env:
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  compile:go:shared:
    internal: true
    summary: Compile Go code to shared library (.so)
    deps:
      - task: generate:android:overlay
    cmds:
      - pwsh -NoProfile -File build/android/scripts/compile_windows.ps1 -Arch "{{.ARCH}}" -Production "{{.PRODUCTION | default "false"}}"
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production,android -trimpath -buildvcs=false -ldflags="-w -s"{{else}}-tags android,debug -buildvcs=false -gcflags=all="-l"{{end}}'

  apk:debug:
    summary: Builds an Android debug APK
    deps:
      - task: prepare
        vars:
          ARCH: '{{.ARCH | default .DEFAULT_ARCH}}'
    cmds:
      - >-
        pwsh -NoProfile -Command '$ErrorActionPreference="Stop"; Push-Location build/android; try { .\gradlew.bat assembleDebug; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } } finally { Pop-Location }; New-Item -ItemType Directory -Force -Path "{{.BIN_DIR}}" | Out-Null; Copy-Item -Force build/android/app/build/outputs/apk/debug/app-debug.apk "{{.BIN_DIR}}/{{.APP_NAME}}-debug.apk"; Write-Host "Debug APK created: {{.BIN_DIR}}/{{.APP_NAME}}-debug.apk"'

  apk:release:
    summary: Builds an Android release APK
    desc: |
      Builds for arm64 by default. Set ARCH=amd64 for an emulator-only APK.
      A configured Android keystore is required for a production signature;
      otherwise Gradle falls back to the debug signing key.
    deps:
      - task: prepare
        vars:
          PRODUCTION: "true"
          ARCH: '{{.ARCH | default .DEFAULT_ARCH}}'
    cmds:
      - >-
        pwsh -NoProfile -Command '$ErrorActionPreference="Stop"; Push-Location build/android; try { .\gradlew.bat assembleRelease; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } } finally { Pop-Location }; New-Item -ItemType Directory -Force -Path "{{.BIN_DIR}}" | Out-Null; Copy-Item -Force build/android/app/build/outputs/apk/release/app-release.apk "{{.BIN_DIR}}/{{.APP_NAME}}-release.apk"; Write-Host "Release APK created: {{.BIN_DIR}}/{{.APP_NAME}}-release.apk"'

  aab:debug:
    summary: Builds an Android debug AAB
    deps:
      - task: prepare
        vars:
          ARCH: '{{.ARCH | default .DEFAULT_ARCH}}'
    cmds:
      - >-
        pwsh -NoProfile -Command '$ErrorActionPreference="Stop"; Push-Location build/android; try { .\gradlew.bat bundleDebug; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } } finally { Pop-Location }; New-Item -ItemType Directory -Force -Path "{{.BIN_DIR}}" | Out-Null; Copy-Item -Force build/android/app/build/outputs/bundle/debug/app-debug.aab "{{.BIN_DIR}}/{{.APP_NAME}}-debug.aab"; Write-Host "Debug AAB created: {{.BIN_DIR}}/{{.APP_NAME}}-debug.aab"'

  aab:release:
    summary: Builds an Android release AAB for Play Store submission
    desc: |
      Builds for arm64 by default. Configure ANDROID_KEYSTORE_FILE,
      ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD
      before creating an AAB for Play Store upload.
    deps:
      - task: prepare
        vars:
          PRODUCTION: "true"
          ARCH: '{{.ARCH | default .DEFAULT_ARCH}}'
    cmds:
      - >-
        pwsh -NoProfile -Command '$ErrorActionPreference="Stop"; if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_FILE)) { Write-Warning "ANDROID_KEYSTORE_FILE is not set; release AAB uses the debug keystore and is not suitable for Play Store upload." }; Push-Location build/android; try { .\gradlew.bat bundleRelease; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } } finally { Pop-Location }; New-Item -ItemType Directory -Force -Path "{{.BIN_DIR}}" | Out-Null; Copy-Item -Force build/android/app/build/outputs/bundle/release/app-release.aab "{{.BIN_DIR}}/{{.APP_NAME}}-release.aab"; Write-Host "Release AAB created: {{.BIN_DIR}}/{{.APP_NAME}}-release.aab"'

  generate:android:overlay:
    internal: true
    summary: Generate Go build overlay that registers the Android main
    sources:
      - build/config.yml
    generates:
      - build/android/overlay.json
      - build/android/gen/main_android.gen.go
    cmds:
      - wails3 android overlay:gen -out build/android/overlay.json -config build/config.yml

  generate:android:bindings:
    internal: true
    summary: Generates bindings for Android
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      # Bindings are generated from the Go AST; CGO is disabled so the NDK
      # is not required for this step
      - wails3 generate bindings -f '-tags android' -clean=true
    env:
      GOOS: android
      CGO_ENABLED: 0

  ensure-emulator:
    internal: true
    summary: Ensure Android Emulator is running
    silent: true
    cmds:
      - pwsh -NoProfile -File build/android/scripts/ensure_emulator_windows.ps1 -SdkRoot "{{.SDK_ROOT}}"

  deploy-emulator:
    summary: Deploy the packaged release APK to the Android Emulator
    deps:
      - task: apk:release
        vars:
          ARCH: '{{.ARCH | default .HOST_ARCH}}'
    cmds:
      - task: ensure-emulator
      - '"{{.ADB}}" uninstall {{.APP_ID}} 2>/dev/null || true'
      - '"{{.ADB}}" install "{{.BIN_DIR}}/{{.APP_NAME}}-release.apk"'
      - '"{{.ADB}}" shell am start -n {{.APP_ID}}/com.wails.app.MainActivity'

  run:
    summary: Build, install and launch a debug build in the Android Emulator
    deps:
      - task: ensure-emulator
    cmds:
      - task: apk:debug
        vars:
          ARCH: '{{.HOST_ARCH}}'
      - '"{{.ADB}}" uninstall {{.APP_ID}} 2>/dev/null || true'
      - '"{{.ADB}}" install "{{.BIN_DIR}}/{{.APP_NAME}}-debug.apk"'
      - '"{{.ADB}}" shell am start -n {{.APP_ID}}/com.wails.app.MainActivity'

  device:list:
    summary: Lists connected Android devices and emulators (serials)
    cmds:
      - '"{{.ADB}}" devices -l'

  run:device:
    summary: Build, install and launch a debug build on a connected physical Android device
    cmds:
      - task: apk:debug
        vars:
          ARCH: arm64
      - |
        DEVICE='{{.DEVICE_ID | default ""}}'
        if [ -z "$DEVICE" ]; then
          DEVICE="${DEVICE_ID:-}"
        fi
        if [ -z "$DEVICE" ]; then
          DEVICE=$("{{.ADB}}" devices | awk 'NR > 1 && $2 == "device" && $1 !~ /^emulator-/ { print $1; exit }')
        fi
        if [ -z "$DEVICE" ]; then
          echo "Error: no connected physical Android device found."
          echo "Pass DEVICE_ID=<serial> to target a device explicitly."
          echo "Find connected device serials with: {{.ADB}} devices"
          exit 1
        fi

        echo "Deploying {{.BIN_DIR}}/{{.APP_NAME}}-debug.apk to device $DEVICE..."
        "{{.ADB}}" -s "$DEVICE" uninstall {{.APP_ID}} 2>/dev/null || true
        "{{.ADB}}" -s "$DEVICE" install "{{.BIN_DIR}}/{{.APP_NAME}}-debug.apk"
        "{{.ADB}}" -s "$DEVICE" shell am start -n {{.APP_ID}}/com.wails.app.MainActivity
    preconditions:
      - sh: '[ -x "{{.ADB}}" ] || command -v adb'
        msg: "adb not found. Install the Android SDK platform-tools (or set ANDROID_HOME)"

  deploy-device:
    summary: Deploy the packaged release APK to a connected physical Android device
    deps:
      - task: apk:release
        vars:
          ARCH: arm64
    cmds:
      - |
        DEVICE='{{.DEVICE_ID | default ""}}'
        if [ -z "$DEVICE" ]; then
          DEVICE="${DEVICE_ID:-}"
        fi
        if [ -z "$DEVICE" ]; then
          DEVICE=$("{{.ADB}}" devices | awk 'NR > 1 && $2 == "device" && $1 !~ /^emulator-/ { print $1; exit }')
        fi
        if [ -z "$DEVICE" ]; then
          echo "Error: no connected physical Android device found."
          echo "Pass DEVICE_ID=<serial> to target a device explicitly."
          echo "Find connected device serials with: {{.ADB}} devices"
          exit 1
        fi

        echo "Deploying {{.BIN_DIR}}/{{.APP_NAME}}-release.apk to device $DEVICE..."
        "{{.ADB}}" -s "$DEVICE" uninstall {{.APP_ID}} 2>/dev/null || true
        "{{.ADB}}" -s "$DEVICE" install "{{.BIN_DIR}}/{{.APP_NAME}}-release.apk"
        "{{.ADB}}" -s "$DEVICE" shell am start -n {{.APP_ID}}/com.wails.app.MainActivity
    preconditions:
      - sh: '[ -x "{{.ADB}}" ] || command -v adb'
        msg: "adb not found. Install the Android SDK platform-tools (or set ANDROID_HOME)"

  studio:
    summary: Open the generated Android project in Android Studio
    cmds:
      - >-
        pwsh -NoProfile -Command '$studio = Get-Command studio64.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1; if (-not $studio) { $candidate = Join-Path $env:ProgramFiles "Android\Android Studio\bin\studio64.exe"; if (Test-Path -LiteralPath $candidate) { $studio = $candidate } }; if (-not $studio) { throw "Android Studio not found" }; Start-Process -FilePath $studio -ArgumentList (Resolve-Path "build/android").Path'

  logs:
    summary: Stream Android logcat filtered to this app
    cmds:
      - '"{{.ADB}}" logcat -v time | grep -E "(Wails|{{.APP_NAME}})" || true'

  logs:all:
    summary: Stream all Android logcat (verbose)
    cmds:
      - '"{{.ADB}}" logcat -v time'

  clean:
    summary: Clean build artifacts
    cmds:
      - pwsh -NoProfile -Command 'Remove-Item -Recurse -Force "{{.BIN_DIR}}", "build/android/app/build", "build/android/.gradle" -ErrorAction SilentlyContinue; Get-ChildItem "build/android/app/src/main/jniLibs" -Filter libwails.so -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force'
