version: '3'

vars:
  APP_NAME: "drive-player"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # This project supports Windows and Android only. On Windows the default is
  # the desktop build; pass GOOS=android to the generic build/package/run tasks.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: '{{if eq .GOOS "android"}}android:apk:debug{{else}}windows:build{{end}}'

  package:
    summary: Packages a production build of the application
    cmds:
      - task: '{{if eq .GOOS "android"}}android:apk:release{{else}}windows:package{{end}}'

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
